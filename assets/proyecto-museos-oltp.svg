<svg xmlns="http://www.w3.org/2000/svg" width="590" height="252" viewBox="0 0 590 252">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D1B22"/><stop offset="1" stop-color="#0B2B2D"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3CCFB8"/><stop offset="1" stop-color="#F2B84B"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ECF5F3" opacity="0.07"/></pattern>
  <clipPath id="clip"><rect width="590" height="252" rx="22"/></clipPath>
</defs>
<rect width="590" height="252" rx="22" fill="url(#bg)"/>
<rect width="590" height="252" rx="22" fill="url(#dots)"/>
<rect x="0" y="0" width="590" height="5" fill="url(#bar)" clip-path="url(#clip)"/>
<text x="30" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#F2B84B">BASE DE DATOS TRANSACCIONAL</text>
<text x="560" y="46" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#8EA7A5">en equipo</text>
<text x="30" y="86" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#ECF5F3">Sistema de gestión para museos</text>
<text x="30" y="122" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8EA7A5">Base de datos OLTP en PostgreSQL con 26 tablas para</text>
<text x="30" y="146" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8EA7A5">obras, artistas, personal, salas, eventos y tickets.</text>
<text x="30" y="170" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#8EA7A5">Reglas de negocio con 10 funciones y triggers.</text>
<rect x="30" y="198" width="100" height="28" rx="14" fill="none" stroke="#3CCFB8" stroke-opacity="0.55" stroke-width="1.3"/>
<text x="80.0" y="217" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#3CCFB8">PostgreSQL</text>
<rect x="138" y="198" width="85" height="28" rx="14" fill="none" stroke="#3CCFB8" stroke-opacity="0.55" stroke-width="1.3"/>
<text x="180.5" y="217" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#3CCFB8">PL/pgSQL</text>
<rect x="231" y="198" width="85" height="28" rx="14" fill="none" stroke="#3CCFB8" stroke-opacity="0.55" stroke-width="1.3"/>
<text x="273.5" y="217" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#3CCFB8">Triggers</text>
<rect x="324" y="198" width="48" height="28" rx="14" fill="none" stroke="#3CCFB8" stroke-opacity="0.55" stroke-width="1.3"/>
<text x="348.0" y="217" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#3CCFB8">SQL</text>
</svg>
